name: Full 1949 identity audit

on:
  push:
    branches: [main]
    paths:
      - 'identity-audit/audit_identities.py'
      - 'identity-audit/adjudicate_audit.py'
      - 'identity-audit/verified_exceptions.csv'
      - '.github/workflows/full1949-identity-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Run league-wide identity audit
        run: python identity-audit/audit_identities.py
      - name: Adjudicate verified aliases and exceptions
        run: python identity-audit/adjudicate_audit.py
      - name: Show raw summary
        run: cat identity-audit/output/full1949_identity_summary.txt
      - name: Show final summary
        run: cat identity-audit/output/full1949_identity_final_summary.txt
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: full1949-identity-audit
          path: identity-audit/output/
      - name: Commit audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add identity-audit/output
          if git diff --cached --quiet; then
            echo 'No audit output changes to commit.'
          else
            git commit -m 'Finalize full 1949 player identity audit results'
            git push
          fi
