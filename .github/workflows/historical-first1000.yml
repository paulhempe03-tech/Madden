name: Historical first 1000 import

on:
  push:
    branches: [main]
    paths:
      - 'historical-import/**'
      - '.github/workflows/historical-first1000.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Assemble exactly 1000 targets
        run: |
          tail -n +2 historical-import/targets_first1000_tail.csv >> historical-import/targets_first1000.csv
          test "$(($(wc -l < historical-import/targets_first1000.csv) - 1))" -eq 1000
      - name: Build historical data for first 1000 players
        run: python historical-import/build_first1000.py
      - name: Commit generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-import/output
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate historical stats for first 1000 players'
            git push
          fi
