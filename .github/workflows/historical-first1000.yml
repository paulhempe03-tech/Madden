name: Historical first 1000 import

on:
  push:
    branches: [main]
    paths:
      - 'historical-import/**'
      - '.github/workflows/historical-first1000.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Restore exact first 1000 baseline targets
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path('historical-import')
          parts=[pd.read_csv(root/'exact'/f'targets_part_{i:03d}.csv') for i in range(1,6)]
          df=pd.concat(parts,ignore_index=True)
          p=root/'targets_first1000.csv'
          df.to_csv(p,index=False)
          print(f'targets={len(df)} unique_ids={df.player_id.nunique()} unique_names={df.player_name.nunique()}')
          assert len(df)==1000
          assert df.player_id.nunique()==1000
          assert df.player_name.nunique()==1000
          assert int(df.iloc[0].player_id)==21586
          assert df.iloc[0].player_name=="Ja'Marr Chase"
          assert int(df.iloc[-1].player_id)==21688
          assert df.iloc[-1].player_name=='Payton Turner'
          PY
      - name: Build historical data for first 1000 players
        run: python historical-import/build_first1000.py
      - name: Review unresolved mappings and zero-history players
        run: python historical-import/review_first1000.py
      - name: Resolve candidate metadata
        run: python historical-import/candidate_metadata.py
      - name: Apply reviewed mapping repairs and final hard audit
        run: python historical-import/repair_first1000.py
      - name: Commit generated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-import/output
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Finalize historical stats for exact first 1000 players'
            git push
          fi
