name: Remaining949 alias probe

on:
  push:
    branches: [main]
    paths:
      - 'historical-import/probe_aliases_remaining949.py'
      - '.github/workflows/remaining949-alias-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python historical-import/probe_aliases_remaining949.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical-import/alias_probe_remaining949.csv
          git commit -m 'Add remaining949 alias probe results' || exit 0
          git push
